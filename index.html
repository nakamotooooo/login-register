<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome | Login & Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light theme">
    <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <main class="stage">
    <div class="card" id="card">

      <!-- Login -->
      <section class="face front" id="loginFace" aria-labelledby="loginTitle">
        <h1 id="loginTitle">Welcome back</h1>
        <p class="sub">Log in to pick up where you left off.</p>
        <form id="loginForm" novalidate>
          <div class="field">
            <input id="loginEmail" type="email" placeholder=" " autocomplete="email" required>
            <label for="loginEmail">Email</label>
            <small class="err"></small>
          </div>
          <div class="field">
            <input id="loginPass" type="password" placeholder=" " autocomplete="current-password" required>
            <label for="loginPass">Password</label>
            <button type="button" class="eye" aria-label="Show password">Show</button>
            <small class="err"></small>
          </div>
          <button class="btn" type="submit">Log in</button>
          <p class="status" role="status" aria-live="polite"></p>
        </form>
        <p class="switch">New here? <button type="button" class="link" data-flip="register">Create an account</button></p>
      </section>

      <!-- Register -->
      <section class="face back" id="registerFace" aria-labelledby="registerTitle" inert>
        <h1 id="registerTitle">Create your account</h1>
        <p class="sub">It takes less than a minute.</p>
        <form id="registerForm" novalidate>
          <div class="field">
            <input id="regName" type="text" placeholder=" " autocomplete="name" required>
            <label for="regName">Full name</label>
            <small class="err"></small>
          </div>
          <div class="field">
            <input id="regEmail" type="email" placeholder=" " autocomplete="email" required>
            <label for="regEmail">Email</label>
            <small class="err"></small>
          </div>
          <div class="field">
            <input id="regPass" type="password" placeholder=" " autocomplete="new-password" required>
            <label for="regPass">Password</label>
            <button type="button" class="eye" aria-label="Show password">Show</button>
            <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <small class="err"></small>
          </div>
          <div class="field">
            <input id="regConfirm" type="password" placeholder=" " autocomplete="new-password" required>
            <label for="regConfirm">Confirm password</label>
            <small class="err"></small>
          </div>
          <button class="btn" type="submit">Create account</button>
          <p class="status" role="status" aria-live="polite"></p>
        </form>
        <p class="switch">Already registered? <button type="button" class="link" data-flip="login">Log in</button></p>
      </section>

    </div>
  </main>

  <script src="code.js"></script>
</body>
</html>
